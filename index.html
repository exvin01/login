<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>CREATE AN ACCOUNT</h1>
    </div>
    
    <form action="/signup" method="post">
        <div class="content">
            <code>Email Address: </code><input type="email" name="email" id=""
            placeholder="example@gmail" required><br><br>
           <code>Phone Number: </code><input type="tel" name="phoneNumber" id=""
           placeholder="+256--" required><br><br>
           <code>Username: </code><input type="text" name="username" id=""
           placeholder="username" required><br><br>
           <code>Password: </code><input type="password" name="password" id=""
           placeholder="****" required><br><br>
           <button>Signup</button>
        <code>Already have an account <a href="login.html">LogIn</a></code>
        </div>
       
    </form>
    

    
</body> 
</html>
